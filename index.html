<style>
:root{--bg:#FAF8F5;--card:#fff;--text:#2C302E;--ink:#2C302E;--mut:#6B726E;--line:#E8E2D9;--sage:#5B8A72;--forest:#476F5B;--peach:#E89874;--sun:#E89874;--ok:#4C8B68;--bad:#C4574B;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif;padding-bottom:170px}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:0;font-weight:600}
header{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}

select,input,textarea,button{font:inherit;color:inherit}
header select,#modal input{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;color:var(--text);max-width:100%}
.icb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:7px 12px;cursor:pointer;color:var(--sage);font-weight:600}

.spd{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.spd button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:99px;color:var(--sage);font-size:18px;line-height:1;cursor:pointer}
.spd button:hover{background:var(--sage);color:#fff}.spd b{min-width:42px;text-align:center;color:var(--text)}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
main{max-width:860px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1.5px solid var(--sage);background:#fff;color:var(--sage);border-radius:var(--r);font-weight:700;cursor:pointer}
.tabs button:hover{background:#EEF4F0}.tabs button.on{background:var(--sage);color:#fff}.tabs button.on:hover{background:var(--forest)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #2c302e14}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sc,.btn{border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:9px;cursor:pointer;text-align:left}
.sc:hover{border-color:var(--sage)}.sc.on{border-color:var(--sage);background:#EEF4F0}
.btn{text-align:center;font-weight:600}.btn:hover{border-color:var(--sage)}
.btn.pri{background:var(--sage);color:#fff;border-color:var(--sage)}.btn.pri:hover{background:var(--forest);border-color:var(--forest)}
.btn.sun{background:#FCEBE2;border-color:#F3CDB9;color:#8a4a2e}
.tag{display:inline-block;background:#FCEBE2;color:#8a4a2e;border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer;margin:2px}
#cin{flex:1;min-width:180px;padding:9px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff}
.mission{background:#FDF1EA;border-left:5px solid var(--peach);padding:8px 12px;border-radius:var(--r);font-size:14px;margin-bottom:10px}
.m{margin:10px 0;display:flex;flex-direction:column}.m.u{align-items:flex-end}
.b{max-width:88%;padding:9px 12px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.m.u .b{background:var(--sage);color:#fff;border:0}
.b.ai.blur{cursor:pointer;position:relative}
.b.blur .es,.b.blur .zh{filter:blur(7px);user-select:none}
.b.blur::after{content:"先聽，點一下看文字";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}
.es{font-size:17px}.zh{color:var(--mut);font-size:13px;margin-top:2px}
.w{cursor:pointer;border-bottom:1px dotted #b9b2a6}
.acts{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.acts button,.rep button,.fb button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer;color:var(--text)}
.acts button:hover,.rep button:hover,.fb button:hover{border-color:var(--sage);color:var(--forest)}
.rep{background:#fff;color:var(--text);border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:4px;max-width:92%}
.g{color:var(--ok);font-weight:800}.r{background:#F8E3DF;color:var(--bad);text-decoration:line-through;border-radius:4px;padding:0 3px}
.mut{color:var(--mut);font-size:13px}
.fb{background:#EEF4F0;border:1px solid #CFE2D6;border-radius:var(--r);padding:8px 10px;margin-top:4px;max-width:92%;font-size:14px}
.fb.imp{background:#FDF1EA;border-color:#F3CDB9}
.hint{background:#fff;border:1.5px dashed var(--peach);border-radius:var(--r);padding:7px 10px;margin:4px 0;cursor:pointer}
.bulb{border:0;background:var(--peach);color:var(--text);border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px #2c302e14;z-index:5}
.bar>div{max-width:860px;margin:0 auto}
.bar input[type=text],.bar textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:8px;background:#fff}

.ir{display:flex;gap:8px;margin-top:6px;align-items:stretch}.ir textarea{flex:1}
.mic{width:54px;border:0;border-radius:var(--r);background:var(--sage);color:#fff;font-size:22px;cursor:pointer}
.mic:hover{background:var(--forest)}.mic.on{background:var(--bad);animation:p 1s infinite}@keyframes p{50%{opacity:.6}}
.send{border:0;background:var(--sage);color:#fff;border-radius:var(--r);padding:0 18px;font-weight:700;cursor:pointer}.send:hover{background:var(--forest)}
.prog{display:flex;gap:6px;margin:8px 0}.prog div{flex:1;text-align:center;padding:6px;border-radius:var(--r);background:#EFEAE2;font-weight:700;font-size:13px}.prog .on{background:var(--sage);color:#fff}.prog .done{background:var(--ok);color:#fff}
.time{font:700 24px Georgia,serif}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:4px}.mic .ic{width:24px;height:24px;margin:0;vertical-align:middle}.hide{display:none!important}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 16px;border-radius:99px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:#2c302e66;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .card{width:100%;max-width:420px;margin:0}
#modal label{display:block;margin-top:10px;font-weight:600}#modal input{width:100%;margin-top:4px}
.score{font:800 34px Georgia,serif}.apto{color:var(--ok)}.noapto{color:var(--bad)}
.dim{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== RWD ===== */

@media(max-width:639px){
 input,textarea,select{font-size:16px}
 main{padding:10px}

 header .row{gap:10px}
 header select,header .btn{flex:1 1 100%;min-height:44px}

 .tabs button{min-height:46px;font-size:14px;padding:8px 4px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .gen>*{flex:1 1 100%;width:100%;min-height:46px}
 .tags{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}.tag{flex:0 0 auto;white-space:nowrap;padding:7px 14px}
 #ex0 .row .btn{flex:1 1 100%;min-height:50px}

 #ex1>div:first-child{flex-direction:column;align-items:center;text-align:center}.time{font-size:40px}
 #ex1 .row{justify-content:center}#ex1 .row .btn{flex:1 1 100%;min-height:50px;font-size:16px}

 .ir{align-items:flex-end}.ir textarea{min-height:52px;max-height:30vh;height:52px}.mic{width:56px;min-height:52px}.send{min-width:72px;min-height:52px;font-size:16px}
}
@media(min-width:640px) and (max-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}#ex1 .row{justify-content:center}}
@media(min-width:1025px){main,.top,header .row,.bar>div{max-width:960px}.grid{grid-template-columns:repeat(5,1fr)}}
.tag.on{background:var(--sage);color:#fff}details.card summary{cursor:pointer;font-weight:700}.lv{font-size:11px;background:#FCEBE2;color:#8a4a2e;border-radius:99px;padding:1px 8px;margin-left:6px}.fl{margin:8px 0 4px;font-size:13px;color:var(--mut)}
.aibar{height:8px;background:#E8E2D9;border-radius:99px;margin-top:4px;overflow:hidden}.aibar i{display:block;height:100%;background:var(--sage);transition:width .2s}.aibtn{font-size:13px;padding:4px 12px}.aibtn:disabled{opacity:.7;cursor:default}
/* ===== 提示橫幅、麥克風提示、診斷 ===== */
#notice{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);width:min(92%,520px);z-index:40;background:#FFF4EE;border:1.5px solid #F3CDB9;border-radius:var(--r);padding:12px 14px;box-shadow:0 6px 20px #2c302e33}
#notice b{display:block;margin-bottom:4px}#notice ol{margin:6px 0 0;padding-left:20px}#notice .acts{margin-top:8px}
.mic.arm{animation:arm 1.2s infinite}@keyframes arm{0%{box-shadow:0 0 0 0 #5B8A7299}70%,100%{box-shadow:0 0 0 14px #5B8A7200}}

#dictbody textarea{width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:var(--r);padding:8px;margin:8px 0;font-size:17px;resize:vertical}#dictbody details{margin:4px 0 8px}
</style></head><body>

<div class="row"><select id="acc"><option value="es-ES">es-ES 西班牙</option><option value="es-MX">es-MX 拉丁美洲</option></select><select id="voice" title="語音聲線選擇器"><option>載入聲線…</option></select><button class="btn" id="vtest" style="padding:6px 12px">試聽</button></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={mic:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>`,spk:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`};
/* ===== 環境偵測：唯一來源（凍結） ===== */
const Env=(()=>{const ua=navigator.userAgent;return Object.freeze({
 SR:window.SpeechRecognition||window.webkitSpeechRecognition,
 tts:'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window,
 ios:/iP(hone|ad|od)/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
 inApp:/Line\/|FBAN|FBAV|Instagram|MicroMessenger|; wv\)/.test(ua),
 secure:window.isSecureContext!==false})})();

/* ===== 診斷紀錄（設定視窗可查看） ===== */
const Diag=(()=>{const L=[];
 const log=m=>{L.push(new Date().toTimeString().slice(0,8)+' '+m);if(L.length>60)L.shift()};
 function render(){const c=[['https 安全環境',Env.secure],['語音辨識 API',!!Env.SR],['語音播放 API',Env.tts],['西班牙文聲線',Speech.hasEsVoice()],['內建瀏覽器',Env.inApp?'⚠️ 是（不支援）':'否'],['平台',Env.ios?'iOS':'其他']];
  $('#diag').innerHTML=c.map(x=>`<div class="dim"><span>${x[0]}</span><b>${x[1]===true?'✅':x[1]===false?'❌':esc(x[1])}</b></div>`).join('')+'<pre>'+esc(L.join('\n')||'（尚無事件）')+'</pre>'}
 return{log,render}})();

/* ===== 統一提示機制：錯誤碼 → 原因＋修復步驟＋退路 ===== */
const Notice=(()=>{
 const T={
  INSECURE:['需要 https 連線','瀏覽器只在 https 網址允許使用麥克風。',['請改用 https:// 開頭的網址開啟本頁']],
  IN_APP:['請改用系統瀏覽器開啟','LINE、Facebook 等內建瀏覽器不支援語音辨識。',['點右上角選單','選「用 Safari / Chrome 開啟」']],
  UNSUPPORTED:['此瀏覽器不支援語音辨識','語音辨識需要 Safari（iOS 14.5 以上）或 Chrome。',['改用 Safari 或 Chrome','也可以先用下方輸入框打字練習']],

function createMachine(name,table,init,quiet){let s=init;const subs=[];
 return{get state(){return s},is:x=>s===x,on:f=>{subs.push(f)},
  send(ev,...a){const nx=table[s]&&table[s][ev];
   if(nx===undefined){if(!quiet)Diag.log(name+'：忽略 '+ev+'@'+s);return false}
   const prev=s;s=nx;if(!quiet&&prev!==nx)Diag.log(name+'：'+prev+' → '+nx+'（'+ev+'）');
   subs.forEach(f=>f(nx,prev,ev,...a));return true}}}

/* ===== 語音模組：TTS 與 ASR 共用單一狀態機（audio: idle | speaking | listening） =====
   規則：同一時間只有一種音訊動作；不再另開 getUserMedia（iOS 麥克風只能被一個擷取來源使用）；
   ASR 只由使用者點擊啟動（iOS 要求）；所有事件處理器以 tok 代號防止舊實例干擾。 */
const Speech=(()=>{
 const A=createMachine('audio',{
  idle:{SPEAK:'speaking',LISTEN:'listening',STOP:'idle'},
  speaking:{SPEAK:'speaking',LISTEN:'listening',END:'idle',STOP:'idle'},
  listening:{SPEAK:'speaking',END:'idle',STOP:'idle'}},'idle',false);
 const S=()=>State.speech;

 const preflight=()=>!Env.secure?'INSECURE':Env.inApp?'IN_APP':!Env.SR?'UNSUPPORTED':null;
 const ASR_ERR={'not-allowed':'DENIED','service-not-allowed':'SERVICE','audio-capture':'CAPTURE','network':'NETWORK','no-speech':'NO_SPEECH','language-not-supported':'UNSUPPORTED'};

 function loadVoices(){if(!Env.tts)return;
  const all=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)),
   sc=v=>{let s=0,n=v.name;if(/premium|enhanced|natural|neural|online/i.test(n))s+=5;if(/google/i.test(n))s+=3;if(/m[oó]nica|paulina|jorge|diego|luc[ií]a|marisol|sabina|juan|elvira|dalia|siri/i.test(n))s+=3;if(/compact|espeak/i.test(n))s-=6;if(v.localService===false)s+=1;if(v.lang.replace('_','-')===S().accent)s+=4;return s},
   prev=S().voice&&S().voice.voiceURI;
  S().voices=all.sort((a,b)=>sc(b)-sc(a));
  const sel=$('#voice');
  sel.innerHTML=S().voices.length?S().voices.map((v,i)=>`<option value="${i}">${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option>找不到西文語音（使用系統預設）</option>';
  const i=Math.max(0,S().voices.findIndex(v=>v.voiceURI===prev));
  S().voice=S().voices[i]||null;if(S().voices.length)sel.value=String(i)}

 /* 停止一切音訊動作並讓所有舊回呼失效 */
 function halt(){if(A.is('listening'))lastAsrEnd=performance.now();
  tok++;clearTimeout(wd);try{rec&&rec.abort()}catch(e){}rec=null;utt=null;
  if(Env.tts&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel();
  A.send('STOP')}

 function speak(text,o={}){const fin0=()=>{o.onEnd&&o.onEnd()};
  if(!Env.tts){Notice.show('NO_TTS');return fin0()}
  const was=speechSynthesis.speaking||speechSynthesis.pending;
  halt();
  if(!o.lang&&!S().voices.length&&speechSynthesis.getVoices().length&&!warnedVoice){warnedVoice=true;Notice.show('NO_VOICE')}
  const id=++tok,u=new SpeechSynthesisUtterance(text);utt=u;   /* 保持強參照，避免 onend 因垃圾回收而不觸發 */
  u.lang=o.lang||S().accent;u.rate=Math.min(2,(o.rate||.85)*S().rate);
  if(!o.lang&&S().voice){u.voice=S().voice;u.lang=S().voice.lang}
  let started=false,ended=false;
  const fin=()=>{if(ended||id!==tok)return;ended=true;clearTimeout(wd);utt=null;A.send('END');fin0()};
  u.onstart=()=>{started=true;clearTimeout(wd);wd=setTimeout(fin,Math.max(5000,text.length*220/u.rate+3000))};   /* onend 遺失時的保險 */
  u.onend=fin;
  u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;Diag.log('tts 錯誤 '+e.error);if(e.error==='not-allowed')Notice.show('TTS_STALLED');fin()};
  A.send('SPEAK');
  wd=setTimeout(()=>{if(started)return;Diag.log('tts 未開始');try{speechSynthesis.cancel()}catch(e){}Notice.show('TTS_STALLED');fin()},4000);
  const go=()=>{if(id!==tok)return;try{speechSynthesis.resume()}catch(e){}speechSynthesis.speak(u)};
  /* Safari：cancel 後需稍等才能 speak；剛結束辨識時需等音訊工作階段切回播放 */
  const wait=Math.max(was?60:0,380-(performance.now()-lastAsrEnd));
  wait>0?setTimeout(go,wait):go()}

 /* 必須在使用者點擊的呼叫鏈中呼叫（iOS）。回傳是否成功啟動。 */
 function listen(o={}){
  const pf=preflight();if(pf){Notice.show(pf);return false}
  if(A.is('listening'))return false;
  halt();
  const id=++tok,r=new Env.SR();rec=r;
  r.lang=S().accent;r.interimResults=o.interim!==false;r.continuous=false;r.maxAlternatives=1;
  let fin='',err=null;
  r.onstart=()=>{if(id!==tok)return;Notice.hide();Diag.log('asr 開始');o.onStart&&o.onStart()};
  r.onresult=e=>{if(id!==tok)return;let t='';for(const x of e.results)t+=x[0].transcript;fin=t;o.onInterim&&o.onInterim(t)};
  r.onerror=e=>{if(id!==tok)return;err=e.error;Diag.log('asr 錯誤 '+e.error);if(ASR_ERR[e.error]&&!(o.quiet&&e.error==='not-allowed'))Notice.show(ASR_ERR[e.error])};
  r.onend=()=>{if(id!==tok)return;rec=null;lastAsrEnd=performance.now();A.send('END');Diag.log('asr 結束 '+(fin?'「'+fin.slice(0,30)+'」':'（空）'));o.onEnd&&o.onEnd(fin.trim(),err)};
  A.send('LISTEN');
  try{r.start()}catch(e){Diag.log('asr 啟動失敗 '+e.message);rec=null;A.send('STOP');Notice.show('CAPTURE');return false}
  return true}

 const stopListening=()=>{try{rec&&rec.stop()}catch(e){}};          /* 結束並取得已辨識內容 */
 function cancelListen(){if(!A.is('listening'))return;tok++;try{rec&&rec.abort()}catch(e){}rec=null;lastAsrEnd=performance.now();A.send('STOP')}   /* 放棄辨識 */

 function init(){

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;:"]/g,'').replace(/\s+/g,' ').trim();
function diff(tg,heard){const T=tg.trim().split(/\s+/).filter(Boolean),tn=T.map(norm),H=norm(heard).split(' ').filter(Boolean),n=T.length,m=H.length;
 const d=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=tn[i]===H[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);

 while(i<n&&j<m){if(tn[i]===H[j]){ok[i]=used[j]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
 const good=ok.filter(Boolean).length;
 return{pct:n?Math.round(good/n*100):0,html:T.map((w,k)=>ok[k]?`<span class="g">${esc(w)}</span>`:`<span class="r">${esc(w)}</span>`).join(' '),miss:good<n,heard:H.filter((_,k)=>!used[k]).join(' ')||'（沒聽到）'}}

function buildFU(text,nf){const nt=norm(text),ow=text.split(/\s+/).map(w=>w.replace(/[¿?¡!.,;:"]/g,'')),nw=ow.map(norm),N=nw.filter(Boolean).length,out=[],seen=new Set();

  if(!ok)out.push({t:1,s:['Gracias. Usted no ha hablado de esto: '+q[0],'謝謝。你還沒談到這點：'+q[1]],src:'你的獨白沒有提到「'+CATZH[c]+'」'})});
 // 2) 內容延伸追問：依你提到的字（依出現順序）
 const m=[];KWLIB.forEach(e=>{let best=null;e.k.forEach(k=>{const ex_=k.endsWith('='),kk=ex_?k.slice(0,-1):k;if(kk.includes(' ')){if(hit(nt,k))best=best===null?nt.indexOf(kk):best;return}
  const i=nw.findIndex(w=>ex_?w===kk:w.startsWith(kk));if(i>=0&&(best===null||i<best))best=i});
  if(best!==null){const i=typeof best==='number'&&best<nw.length?best:0;m.push({i,e,w:ow[i]||e.k[0]})}});
 m.sort((a,b)=>a.i-b.i).forEach(x=>out.push({t:1,s:['Ha dicho "'+x.w+'". '+x.e.es,'你提到了「'+x.w+'」。'+x.e.zh],src:'你提到了「'+x.w+'」'}));
 // 3) 保底：隨機題庫
 shuf(FU).forEach(f=>out.push({t:1,s:P(f),src:'隨機追問'}));
 return out.slice(0,nf)}

 let up=base;const nt=norm(base),neg=NEGW.test(nt),hard=/(^| )(no|nunca|jamas)( |$)/.test(nt);
 /* 人稱／時態：非第一人稱或過去式 → 不自動延伸，避免「Mi madre trabaja… Además, me levanto temprano」 */
 const past=/(^| )(ayer|anoche|pasad[oa]|antes|fui|fue|fuimos|comi|comimos|estuve|tuve|hice|vi|compre|viaje|visite|era|estaba|tenia|vivia|hizo|me levante|me acoste)( |$)/.test(nt),

  sing=/(^| )(mi|el|la|un|una) (madre|padre|hermano|hermana|amigo|amiga|perro|gato|novio|novia|abuelo|abuela|tio|tia|primo|prima|hijo|hija)( |$)/.test(nt),
  sg=t=>sing?t.replace(/\bson\b/,'es').replace('muy importantes','muy importante').replace('me hacen','me hace').replace('me ayudan','me ayuda'):t;
 /* 語意錨點：健康／價格詞優先；其餘取「最早出現」的內容語意群，通用群（gusta／necesito）只作兜底 */
 let gi=/(^| )(duel\w*|dolor|enferm\w*|fiebre|gripe|resfriado)/.test(nt)?40:/(^| )(caro|cara|caros|caras)( |$)/.test(nt)?35:-1;
 if(gi<0){let bp=1e9;KR.forEach((k,i)=>{if(i>=57)return;const m=k[0].exec(nt);if(m&&m.index<bp){bp=m.index;gi=i}});if(gi<0)gi=KR.findIndex((k,i)=>i>=57&&k[0].test(nt))}
 const r=gi>=0?KR[gi]:null,c=gi>=0?CLS[gi]:'z';
 const x=XT[c==='N'&&neg&&/(^| )no (necesito|quiero|busco)/.test(nt)?'M':c]||XT.z;
 /* 描述性句子（擁有／身分／存在）不是行為，不加 porque */
 if(!hasC&&!desc){if(r&&r[2]==='t'){up+=' '+pick(r[1]);tips.unshift('補上時間資訊，讓描述更具體')}else{up+=', '+sg(neg?pick(x[2]):r?pick(r[1]):pick(GEN_R));tips.unshift('用 porque 補充原因'+(neg?'（偵測到負面語氣，原因子句改用負面情境專屬句）':'，避免只講單句，直接提升連貫性分數'))}}

 else{const pool=(neg?x[1]:x[0]).filter(t=>hard||!/^Tampoco/.test(t)),ext=pick(pool.length?pool:x[neg?1:0]);up+='. '+ext+'.';tips.push('用 '+ext.split(',')[0]+' 延伸（'+(neg?'負面／抱怨語氣，改用因果或負向連接詞':'正面／中性語氣，用正向疊加')+'，且只圍繞同一語意群）')}

const upHTML=(text,rr)=>{const r=rr||upgrade(text);if(!r)return'<div>這是問句，不需要升級；試著用完整句回答對方的問題。</div>';

const AI={ready:false,loading:false,gen:null,dev:'',files:{},msg:'',pct:null,model:'onnx-community/Qwen2.5-0.5B-Instruct',lib:'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.0'};

 try{const T=await import(AI.lib);let gpu=false;try{gpu=!!(navigator.gpu&&await navigator.gpu.requestAdapter())}catch(e){}
  let sawP=false;const cb=d=>{if(d.status==='progress'&&d.total){sawP=true;AI.files[d.file]=[d.loaded,d.total];let L=0,Tt=0;for(const k in AI.files){L+=AI.files[k][0];Tt+=AI.files[k][1]}const p=Math.round(L/Tt*100);AI.ui('下載中 '+p+'%（'+(L/1048576).toFixed(0)+' / '+(Tt/1048576).toFixed(0)+' MB）',p)}else if(d.status==='initiate'&&!sawP)AI.ui('檢查快取／連線中…（'+(gpu?'WebGPU':'WASM')+'）',null)};
  const mk=(device,dtype)=>T.pipeline('text-generation',AI.model,{device,dtype,progress_callback:cb});
  try{AI.gen=await mk(gpu?'webgpu':'wasm',gpu?'q4f16':'q4');AI.dev=gpu?'WebGPU':'WASM'}catch(e){if(!gpu)throw e;AI.files={};AI.gen=await mk('wasm','q4');AI.dev='WASM（WebGPU 失敗，已降級）'}
  AI.ready=true;localStorage.setItem('habla_ai','1');AI.ui('✅ 本地 AI 已就緒（'+AI.dev+'；已快取於瀏覽器，下次免下載）'+(sawP?'':'（本次由快取載入）'));toast('本地 AI 已就緒')}
 catch(e){AI.ui('❌ 載入失敗，維持規則引擎：'+esc(e.message||e));toast('離線 AI 載入失敗，使用規則引擎')}

/* ===== 聽寫挑戰：聽 → 打字 → 逐字比對（不依賴語音辨識，iOS 最穩） ===== */
const Dict=(()=>{
 const M=createMachine('dict',{idle:{START:'question'},question:{CHECK:'result',START:'question'},result:{NEXT:'question',FINISH:'done',START:'question'},done:{START:'question'}},'idle');
 const N=5;let lvl='A1',items=[],i=0,plays=0,res=[];
 const box=()=>$('#dictbody'),clean=s=>s.toLowerCase().replace(/[¿?¡!.,;:"]/g,'');
 const nw=x=>x.es.split(/\s+/).length;
 function pool(l){const seen=new Set(),out=[];
  const add=(es,zh)=>{es=(es||'').trim();const k=norm(es);if(!es||seen.has(k))return;seen.add(k);out.push({es,zh:zh||''})};
  Object.values(ALL).forEach(s=>(s.hints||[]).forEach(h=>add(h[0],h[1])));
  Object.values(DLG).forEach(a=>a.forEach(x=>{const q=x.split('|');add(q[0],q[1])}));
  return out.filter(x=>l==='A1'?nw(x)<=5:nw(x)>=5&&nw(x)<=10)}
 const accWords=(tg,typed)=>{const hw=new Set(clean(typed).split(/\s+/).filter(Boolean)),hn=new Set([...hw].map(norm));return clean(tg).split(/\s+/).filter(w=>w&&!hw.has(w)&&hn.has(norm(w)))};
 const prog=()=>'<div class="prog">'+Array.from({length:N},(_,k)=>`<div class="${k<i||(k===i&&M.is('result'))?'done':k===i?'on':''}">${k+1}</div>`).join('')+'</div>';
 const sayBtns=es=>`<div class="acts"><button data-say="${esc(es)}" data-rate=".85">${IC.spk}正常</button><button data-say="${esc(es)}" data-rate=".6">${IC.spk}慢速</button></div>`;
 function play(rate){plays++;Speech.speak(items[i].es,{rate});const c=$('#dcnt');if(c)c.textContent=plays}
 function render(){const b=box(),s=M.state,it=items[i];
  if(s==='idle'){b.innerHTML=`<h3>聽寫挑戰</h3><p class="mut">輸入聽到的西班牙文句子。每輪 ${N} 題。</p><div class="row"><button class="btn pri" data-dstart="A1">A1 短句（5 字內）</button><button class="btn pri" data-dstart="A2">A2 長句（5–10 字）</button></div>`;return}
  if(s==='question'){b.innerHTML=`${prog()}<div class="mut">第 ${i+1} / ${N} 題　已聽 <b id="dcnt">${plays}</b> 次</div><div class="row"><button class="btn pri" data-dplay=".85">${IC.spk}正常速度</button><button class="btn" data-dplay=".6">${IC.spk}慢速</button></div><textarea id="dans" autocapitalize="off" autocorrect="off" spellcheck="false" lang="es" placeholder="輸入你聽到的西班牙文"></textarea><details><summary class="mut">看中文提示</summary><div class="zh">${esc(it.zh||'（無）')}</div></details><div class="row"><button class="btn pri" data-dcheck>檢查答案</button></div>`;return}
  if(s==='result'){const r=res[res.length-1];
   b.innerHTML=`${prog()}<div class="rep" style="max-width:100%"><b>準確率 ${r.pct}%</b>　<span class="mut">已聽 ${r.plays} 次</span><div class="es">${r.html}</div>${r.miss?`<div class="mut">你打的：${esc(r.typed)}</div>`:''}${r.acc.length?`<div class="mut">重音／符號要注意：${esc(r.acc.join('、'))}</div>`:''}</div><div class="fb"><div class="es">${esc(r.es)}</div><div class="zh">${esc(r.zh)}</div>${sayBtns(r.es)}</div><div class="row"><button class="btn pri" data-dnext>${i+1>=N?'看成績':'下一題'}</button></div>`;return}
  const avg=Math.round(res.reduce((a,x)=>a+x.pct,0)/res.length),weak=res.filter(x=>x.pct<80||x.acc.length),other=lvl==='A1'?'A2':'A1';
  b.innerHTML=`<h3>本輪成績</h3><div class="score ${avg>=80?'apto':'noapto'}">${avg}%</div><div class="mut">平均準確率（${lvl}）</div>${weak.length?'<h3 style="font-size:16px;margin-top:10px">需要再練的句子</h3>'+weak.map(x=>`<div class="fb"><div class="es">${esc(x.es)}</div><div class="zh">${esc(x.zh)}</div>${sayBtns(x.es)}</div>`).join(''):'<p>全部都很穩，換更長的句子挑戰看看！</p>'}<div class="row"><button class="btn pri" data-dstart="${lvl}">再來一輪</button><button class="btn" data-dstart="${other}">換 ${other}</button></div>`}
 function start(l){const list=shuf(pool(l)).slice(0,N);if(list.length<N)return toast('題庫不足');lvl=l;items=list;i=0;plays=0;res=[];M.send('START');render();play(.85)}
 function check(){const a=$('#dans'),v=a?a.value.trim():'';if(!v)return toast('先打出你聽到的句子');Speech.halt();
  const it=items[i],d=diff(it.es,v);res.push({es:it.es,zh:it.zh,pct:d.pct,html:d.html,miss:d.miss,typed:v,acc:accWords(it.es,v),plays});M.send('CHECK');render()}
 function next(){if(i+1>=N){M.send('FINISH');return render()}i++;plays=0;M.send('NEXT');render();play(.85)}
 const root=$('#dict');
 root.addEventListener('click',e=>{const t=e.target;let b;
  if(b=t.closest('[data-dstart]'))return start(b.dataset.dstart);
  if(b=t.closest('[data-dplay]'))return play(+b.dataset.dplay);
  if(t.closest('[data-dcheck]'))return check();
  if(t.closest('[data-dnext]'))return next()});

 return{open:render}})();

const ADD=/Además|También/,NEGC=/Por eso|Por desgracia|Tampoco/;
const GOLD=[['Me gusta el café',r=>!r.neg&&ADD.test(r.up)],['No me gusta el café',r=>r.neg&&NEGC.test(r.up)&&!ADD.test(r.up)],['Me duele la cabeza y no puedo trabajar',r=>r.neg&&!ADD.test(r.up)],['Me encanta la música',r=>!/encanta mucho/.test(r.up)],['Mi madre trabaja mucho',r=>!ADD.test(r.up)&&!NEGC.test(r.up)],['Ayer fui al cine',r=>!ADD.test(r.up)],['Tengo un perro',r=>!/porque/.test(r.up)&&ADD.test(r.up)],['Hablo con mi madre',r=>!/son muy/.test(r.up)],['Hoy estoy muy cansado',r=>r.neg&&!ADD.test(r.up)],['No quiero comprar ropa',r=>NEGC.test(r.up)&&!ADD.test(r.up)],['Necesito un hotel',r=>/porque/.test(r.up)&&ADD.test(r.up)],['Soy cansado',r=>/^Estoy cansado/.test(r.fix)],['Voy a la playa porque me gusta el sol',r=>ADD.test(r.up)&&!/porque.*porque/.test(r.up)],['No tengo dinero',r=>r.neg&&!ADD.test(r.up)],['Me gusta jugar al fútbol',r=>!r.neg&&ADD.test(r.up)]];
if(location.hash==='#test'){const out=[];GOLD.forEach(([t,f])=>{let ok=true,ex_='';for(let k=0;k<20;k++){const r=upgrade(t);if(!f(r)){ok=false;ex_=r.up;break}}out.push((ok?'✅ ':'❌ ')+t+(ok?'':' → '+ex_))});
 console.log(out.join('\n'));document.body.insertAdjacentHTML('afterbegin','<pre style="white-space:pre-wrap;background:#fff;border:2px solid var(--sage);padding:10px;margin:8px;font-size:12px">黃金測試 '+out.filter(x=>x[0]==='✅').length+'/'+out.length+'\n'+esc(out.join('\n'))+'</pre>')}
