<style>
:root{--bg:#FAF8F5;--card:#fff;--text:#2C302E;--ink:#2C302E;--mut:#6B726E;--line:#E8E2D9;--sage:#5B8A72;--forest:#476F5B;--peach:#E89874;--sun:#E89874;--ok:#4C8B68;--bad:#C4574B;--r:14px}

<header><div class="top"><h1>Habla<span>.</span> <small style="font-weight:400;font-size:13px;color:var(--mut)">西班牙文口說陪練 A1–A2</small></h1><button class="icb" id="gear" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>設定</button></div>
<div class="row"><select id="acc"><option value="es-ES">es-ES 西班牙</option><option value="es-MX">es-MX 拉丁美洲</option></select><select id="voice" title="語音聲線選擇器"><option>載入聲線…</option></select><button class="btn" id="vtest" style="padding:6px 12px">試聽</button></div>
<div class="row"><div class="spd">語速<button id="sm" aria-label="減慢">−</button><b id="sv">1.0x</b><button id="sp" aria-label="加快">+</button></div><label class="sw"><input type="checkbox" id="hf" style="width:auto"> 電話對談模式（可隨時插話）</label></div></header>
<main>
<div class="tabs"><button class="on" data-tab="chat">情境對話</button><button data-tab="exam">DELE A1/A2 模擬口試室</button></div>

<section id="chat">

</main>

<div class="bar"><div>
<div class="row" style="margin:0"><input type="text" id="tgt" placeholder="當前跟讀目標句（點提示卡或手動輸入；留空=自由回答）" style="flex:1"><button class="btn" id="tclr" style="padding:6px 12px">清除</button></div>
<div class="ir"><button class="mic" id="mic" title="按一下開始說話" aria-label="麥克風"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button><textarea id="inp" placeholder="說話或輸入西文…（可再按麥克風接續補講）"></textarea><button class="send" id="send">送出</button></div>
<div class="mut" id="stat" style="min-height:18px"></div>
</div></div>
<div id="modal" class="hide"><div class="card"><h3>設定</h3><label for="key">Anthropic API Key（選填）</label><input id="key" type="password" placeholder="留空 = 離線模擬模式"><p class="mut">Key 只儲存在這支裝置的瀏覽器中。</p><button class="btn pri" id="mclose" style="width:100%">完成</button></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={mic:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>`,spk:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let spd=1,accent='es-ES',voices=[],curVoice=null,key=localStorage.getItem('habla_key')||'',target='',mode='chat',busy=false,rec=null,listening=false,sid=0,hf=false;
let scen=null,hist=[],turns=0,ex=null;
$('#key').value=key;$('#key').onchange=e=>{key=e.target.value.trim();localStorage.setItem('habla_key',key);toast(key?'已儲存 API Key':'模擬模式')};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ===== 語音合成 ===== */
function loadVoices(){const all=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
 const sc=v=>{let s=0,n=v.name;if(/premium|enhanced|natural|neural|online/i.test(n))s+=5;if(/google/i.test(n))s+=3;if(/m[oó]nica|paulina|jorge|diego|luc[ií]a|marisol|sabina|juan|elvira|dalia|siri/i.test(n))s+=3;if(/compact|espeak/i.test(n))s-=6;if(v.localService===false)s+=1;if(v.lang.replace('_','-')===accent)s+=4;return s};
 voices=all.sort((a,b)=>sc(b)-sc(a));const sel=$('#voice');
 sel.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${esc(v.name)} (${v.lang})</option>`).join(''):'<option>找不到西文語音（使用系統預設）</option>';
 curVoice=voices[0]||null}
loadVoices();speechSynthesis.onvoiceschanged=loadVoices;
$('#voice').onchange=e=>{curVoice=voices[e.target.value]};
$('#acc').onchange=e=>{accent=e.target.value;loadVoices()};
$('#vtest').onclick=()=>speak('Hola, ¿cómo estás? Me llamo Lucía.',.85);
function speak(text,rate=.85,done,lang){speechSynthesis.cancel();const id=++sid,u=new SpeechSynthesisUtterance(text);u.lang=lang||accent;u.rate=Math.min(2,rate*spd);if(!lang&&curVoice){u.voice=curVoice;u.lang=curVoice.lang}
 u.onend=u.onerror=()=>{if(id===sid&&done)done()};speechSynthesis.speak(u)}
function speakAI(t){speak(t,.85,()=>{if(hf&&!busy)listen()})}

/* ===== 語音辨識 ===== */
function listen(){if(!SR)return toast('此瀏覽器不支援語音辨識（建議 Chrome / Safari）');
 try{rec&&rec.abort()}catch(e){}
 rec=new SR();rec.lang=accent;rec.interimResults=true;rec.continuous=false;let fin='';
 rec.onstart=()=>{listening=true;$('#mic').classList.add('on');$('#stat').textContent='聆聽中…'};
 rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;fin=t;$('#stat').textContent=''+t};
 rec.onerror=e=>{$('#stat').textContent=e.error==='not-allowed'?'請允許麥克風權限':''};
 rec.onend=()=>{listening=false;$('#mic').classList.remove('on');$('#stat').textContent='';if(fin.trim())onSpeech(fin.trim());else if(hf&&!busy&&!speechSynthesis.speaking)setTimeout(()=>{if(hf&&!listening&&!busy)listen()},600)};
 try{rec.start()}catch(e){}}
$('#mic').onclick=()=>{if(listening){rec.stop();return}speechSynthesis.cancel();sid++;listen()};
function onSpeech(t){const inp=$('#inp');
 if(mode==='chat'&&target){inp.value=t;submit();return}
 if(hf){inp.value=t;submit();return}
 inp.value=(inp.value?inp.value+' ':'')+t}  // 不自動送出，可補講
$('#tgt').oninput=e=>target=e.target.value.trim();
$('#tclr').onclick=()=>setTarget('');
function setTarget(t){target=t;$('#tgt').value=t}

/* ===== 電話模式：音量偵測與插話 ===== */
let actx,stream,mon;
$('#hf').onchange=async e=>{hf=e.target.checked;
 if(hf){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});actx=new (window.AudioContext||window.webkitAudioContext)();const an=actx.createAnalyser();an.fftSize=1024;actx.createMediaStreamSource(stream).connect(an);const buf=new Uint8Array(an.fftSize);let acc=0;
  mon=setInterval(()=>{an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}const rms=Math.sqrt(s/buf.length);
   if(speechSynthesis.speaking&&rms>.06){acc+=50;if(acc>=200){acc=0;sid++;speechSynthesis.cancel();listen();toast('偵測到插話')}}else acc=0},50);
  toast('電話模式開啟');if(!speechSynthesis.speaking&&!busy)listen()}catch(err){hf=false;e.target.checked=false;toast('無法使用麥克風')}}
 else{clearInterval(mon);stream&&stream.getTracks().forEach(t=>t.stop());actx&&actx.close();try{rec&&rec.abort()}catch(e){}}};

/* ===== 逐字發音比對 ===== */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;:"]/g,'').replace(/\s+/g,' ').trim();
function diff(tg,heard){const T=tg.trim().split(/\s+/).filter(Boolean),tn=T.map(norm),H=norm(heard).split(' ').filter(Boolean),n=T.length,m=H.length;
 const d=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=tn[i]===H[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
 const ok=Array(n).fill(false),used=Array(m).fill(false);let i=0,j=0;
 while(i<n&&j<m){if(tn[i]===H[j]){ok[i]=used[j]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
 const good=ok.filter(Boolean).length;
 return{pct:n?Math.round(good/n*100):0,html:T.map((w,k)=>ok[k]?`<span class="g">${esc(w)}</span>`:`<span class="r">${esc(w)}</span>`).join(' '),miss:good<n,heard:H.filter((_,k)=>!used[k]).join(' ')||'（沒聽到）'}}

/* ===== Claude API ===== */
async function claude(system,messages,max=900){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:max,system,messages})});
 const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||r.status);
 return JSON.parse(d.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim())}

/* ===== 情境資料 ===== */
const S=[
